services:
  postgres:
    image: postgres:16-alpine
    container_name: frakdev-postgres
    restart: unless-stopped

    env_file:
      - .env

    volumes:
      - ./postgres/data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - frakdev

networks:
  frakdev:
    driver: bridge
