services:
  postgres:
    image: postgres:16-alpine
    container_name: frakdev-postgres
    restart: unless-stopped

    env_file:
      - .env

    volumes:
      - ./postgres/data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - frakdev

  app:
    build:
      context: ./app
      dockerfile: Dockerfile

    container_name: frakdev-app
    restart: unless-stopped

    env_file:
      - .env

    environment:
      NODE_ENV: production
      PORT: 3000

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "127.0.0.1:3000:3000"

    networks:
      - frakdev

networks:
  frakdev:
    driver: bridge
